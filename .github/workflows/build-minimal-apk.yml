name: Build Minimal Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      working-directory: ./mobile-minimal
      run: flutter pub get

    - name: Create assets directories
      working-directory: ./mobile-minimal
      run: |
        mkdir -p assets/images
        mkdir -p assets/icons
        mkdir -p assets/fonts

    - name: Build APK
      working-directory: ./mobile-minimal
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cusin-minimal-apk
        path: mobile-minimal/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
      if: success()
